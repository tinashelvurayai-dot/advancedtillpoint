<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e40af" />
    <title>TillPoint - Offline workspace</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, sans-serif;
        background: #f7faf8;
        color: #172033;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 440px;
        text-align: center;
        background: white;
        border: 1px solid #dbe4ef;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 12px 36px rgba(23, 32, 51, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 25px;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #526176;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TillPoint workspace</h1>
      <p>
        Your saved TillPoint workspace is ready. Open the app from your home screen to use cached
        pages and continue recording offline sales; changes will sync when you reconnect.
      </p>
    </main>
  </body>
</html>
